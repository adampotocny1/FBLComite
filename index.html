<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FBL Comité</title>
  <style>
    :root { --bg:#fff; --fg:#111; --muted:#999; --line:#e8e8e8; --now:#f6f6f1; --hover:#f2f2f2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111; --fg:#eee; --muted:#6f6f6f; --line:#262626; --now:#1a1a18; --hover:#202020; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width:1100px; margin:0 auto; padding:48px 16px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
    h1 { font-size:20px; font-weight:600; margin:0; }
    .nav { display:flex; align-items:center; gap:12px; }
    .nav button { background:none; border:1px solid var(--line); color:var(--fg); border-radius:6px; width:32px; height:32px; cursor:pointer; font-size:16px; }
    .nav button:hover { border-color:var(--muted); }
    #month { min-width:150px; text-align:center; font-weight:500; }
    .wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:760px; table-layout:fixed; }
    th, td { border-bottom:1px solid var(--line); padding:12px 10px; text-align:left; vertical-align:top; }
    thead th { font-weight:500; font-size:13px; color:var(--muted); }
    thead th small { display:block; font-weight:400; font-size:12px; }
    thead th:first-child, tbody th { width:180px; }
    tbody th { font-weight:600; }
    .now { background:var(--now); }
    ul { margin:0; padding:0; list-style:none; }
    li { padding:3px 6px; margin:0 -6px 2px; border-radius:4px; cursor:text; overflow-wrap:anywhere; }
    li:hover { background:var(--hover); }
    .day { color:var(--muted); font-size:13px; margin-right:4px; white-space:nowrap; }
    .add { background:none; border:0; padding:3px 0; color:var(--muted); font:inherit; font-size:13px; cursor:pointer; opacity:0; }
    td:hover .add, .add:focus { opacity:1; }
    @media (hover:none) { .add { opacity:1; } }
    .editor { display:flex; flex-direction:column; gap:4px; margin:0 -6px; }
    .editor select, .editor input { width:100%; font:inherit; font-size:14px; color:var(--fg); background:var(--bg); border:1px solid var(--muted); border-radius:4px; padding:2px 6px; outline:none; }
    li:has(.editor):hover { background:none; }
    footer { margin-top:24px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .warn { color:#c0392b; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>FBL Comité</h1>
      <div class="nav">
        <button id="prev" aria-label="Previous month">‹</button>
        <span id="month"></span>
        <button id="next" aria-label="Next month">›</button>
      </div>
    </header>

    <div class="wrap"><table id="grid"></table></div>

    <footer>
      <span>Click “+ Add” in a cell to add an event (pick the day, type, press Enter). Click an event to edit it, clear its text to delete it.</span>
      <span id="status"></span>
    </footer>
  </main>

  <script>
    // ── Settings ───────────────────────────────────────────────
    const API_URL = 'https://script.google.com/macros/s/AKfycbyc7oHMWhKHXm3ZnZRQGuM1cPOkB-POGRAhI0slXjaJW8bo68CTjeKKg8JubzinV7pf/exec';
    const POLES = [
      'Pôle Bar',
      'Pôle Cinéma',
      'Pôle Events',
      'Pôle Arts et Culture',
      'Pôle Photo',
      'Pôle Soutien',
      'Pôle Sport',
      'Pôle écologie',
      'Pôle Communication'
    ];
    // ───────────────────────────────────────────────────────────

    const WEEKS = [[1, 7], [8, 14], [15, 21], [22, 31]]; // week 4 runs to month end
    const CONNECTED = API_URL.startsWith('https://');
    const today = new Date();
    let view = new Date(today.getFullYear(), today.getMonth(), 1);
    let events = []; // { id, date: 'YYYY-MM-DD', pole, text }

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const pad = n => String(n).padStart(2, '0');
    const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    const weekOf = day => Math.min(Math.ceil(day / 7), 4);
    const dayLabel = day => new Date(view.getFullYear(), view.getMonth(), day)
      .toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });
    const status = (msg, warn) => { $('status').textContent = msg; $('status').className = warn ? 'warn' : ''; };

    function daysOfWeek(w) {
      const lastDay = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
      const [a, b] = WEEKS[w - 1];
      const out = [];
      for (let d = a; d <= Math.min(b, lastDay); d++) out.push(d);
      return out;
    }

    function render() {
      const y = view.getFullYear(), m = view.getMonth(), mk = monthKey(view);
      const lastDay = new Date(y, m + 1, 0).getDate();
      const short = view.toLocaleDateString('en-GB', { month: 'short' });
      $('month').textContent = view.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

      const isThisMonth = y === today.getFullYear() && m === today.getMonth();
      const nowWeek = isThisMonth ? weekOf(today.getDate()) : 0;
      const cls = w => (w === nowWeek ? ' class="now"' : '');

      let html = '<thead><tr><th></th>';
      WEEKS.forEach(([a, b], i) => {
        html += `<th${cls(i + 1)}>Week ${i + 1}<small>${a}–${Math.min(b, lastDay)} ${short}</small></th>`;
      });
      html += '</tr></thead><tbody>';

      POLES.forEach(pole => {
        html += `<tr><th>${esc(pole)}</th>`;
        for (let w = 1; w <= 4; w++) {
          const items = events
            .filter(e => e.date.slice(0, 7) === mk && e.pole === pole && weekOf(+e.date.slice(8)) === w)
            .sort((a, b) => a.date.localeCompare(b.date));
          html += `<td${cls(w)} data-pole="${esc(pole)}" data-week="${w}"><ul>` +
            items.map(e => `<li data-i="${events.indexOf(e)}"><span class="day">${dayLabel(+e.date.slice(8))}</span>${esc(e.text)}</li>`).join('') +
            `</ul><button class="add">+ Add</button></td>`;
        }
        html += '</tr>';
      });
      $('grid').innerHTML = html + '</tbody>';
    }

    // Day picker + text field. Enter or clicking elsewhere saves, Esc cancels.
    let closeEditor = null;
    function openEditor(container, days, day, text, onSave) {
      container.innerHTML = '<div class="editor"><select aria-label="Day">' +
        days.map(d => `<option value="${d}"${d === day ? ' selected' : ''}>${dayLabel(d)}</option>`).join('') +
        '</select><input aria-label="Event" placeholder="e.g. Movie night, 20h"></div>';
      const ed = container.firstChild, sel = ed.querySelector('select'), input = ed.querySelector('input');
      input.value = text;
      input.focus();

      let done = false;
      const finish = save => {
        if (done) return;
        done = true;
        closeEditor = null;
        document.removeEventListener('pointerdown', outside, true);
        save ? onSave(+sel.value, input.value.trim()) : render();
      };
      const outside = e => { if (!ed.contains(e.target)) finish(true); };
      document.addEventListener('pointerdown', outside, true);
      ed.addEventListener('keydown', e => {
        if (e.key === 'Enter') finish(true);
        if (e.key === 'Escape') finish(false);
      });
      closeEditor = finish;
    }

    $('grid').addEventListener('click', e => {
      const li = e.target.closest('li[data-i]');
      const addBtn = e.target.closest('.add');
      if (!li && !addBtn) return;
      if (li && li.querySelector('.editor')) return;
      if (closeEditor) closeEditor(true);

      const mk = monthKey(view);
      if (li) {
        const ev = events[+li.dataset.i];
        const day = +ev.date.slice(8);
        openEditor(li, daysOfWeek(weekOf(day)), day, ev.text, (newDay, text) => {
          if (text === ev.text && newDay === day) return render();
          if (!text) {
            events.splice(events.indexOf(ev), 1);
            render();
            save({ action: 'delete', id: ev.id });
          } else {
            ev.text = text;
            ev.date = `${mk}-${pad(newDay)}`;
            render();
            save({ action: 'update', id: ev.id, date: ev.date, pole: ev.pole, text });
          }
        });
      } else {
        const td = addBtn.closest('td');
        const w = +td.dataset.week, pole = td.dataset.pole;
        const days = daysOfWeek(w);
        const isThisMonth = mk === monthKey(today);
        const defaultDay = isThisMonth && days.includes(today.getDate()) ? today.getDate() : days[0];
        const li = document.createElement('li');
        td.querySelector('ul').append(li);
        addBtn.remove();
        openEditor(li, days, defaultDay, '', (day, text) => {
          if (!text) return render();
          const ev = { id: null, date: `${mk}-${pad(day)}`, pole, text };
          events.push(ev);
          render();
          save({ action: 'add', date: ev.date, pole, text }).then(r => { if (r) ev.id = r.id; });
        });
      }
    });

    // ── Talking to the Google Sheet ────────────────────────────
    function getCode() { try { return localStorage.getItem('fblCode') || ''; } catch { return ''; } }
    function setCode(c) { try { localStorage.setItem('fblCode', c); } catch {} }

    async function save(body) {
      if (!CONNECTED) return { ok: true, id: crypto.randomUUID() }; // demo mode: nothing is stored
      status('Saving…');
      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ ...body, code: getCode() }) }).then(r => r.json());
        if (res.error === 'wrong code') {
          const code = prompt('Enter the editing code:');
          if (code === null) throw new Error('no code entered');
          setCode(code.trim());
          return save(body);
        }
        if (res.error) throw new Error(res.error);
        status('Saved');
        setTimeout(() => status(''), 1500);
        return res;
      } catch (err) {
        status('Could not save: ' + err.message, true);
        load();
      }
    }

    async function load() {
      if (!CONNECTED) {
        status('Demo mode: not connected to a Google Sheet yet, changes are not saved.', true);
        return render();
      }
      try {
        const res = await fetch(API_URL).then(r => r.json());
        events = res.events;
        status('');
        render();
      } catch {
        status('Could not load events.', true);
      }
    }

    $('prev').onclick = () => { if (closeEditor) closeEditor(false); view.setMonth(view.getMonth() - 1); render(); };
    $('next').onclick = () => { if (closeEditor) closeEditor(false); view.setMonth(view.getMonth() + 1); render(); };

    render();
    load();
  </script>
</body>
</html>
